on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'tree:0'
      
      - name: Commit metadata
        id: metadata
        run: |
          echo "timestamp=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT
          echo "version_tag=$(git describe --always)" >> $GITHUB_OUTPUT
      
      - name: ghcr.io auth
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          context: .
          tags: ghcr.io/jcopi/process-exporter:latest, ghcr.io/jcopi/process-exporter:${{ steps.metadata.outputs.version_tag }}
          push: true
        env:
          VERSION_TAG: ${{ steps.metadata.outputs.version_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.timestamp }}